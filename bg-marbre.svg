<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2400" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f5e2b1"/>
    <stop offset="0.55" stop-color="#dfb36b"/>
    <stop offset="1" stop-color="#d19a4b"/>
  </linearGradient>
  <filter id="noise">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="7"/>
    <feColorMatrix type="saturate" values="0.2"/>
    <feComponentTransfer>
      <feFuncA type="table" tableValues="0 0.02 0.04 0.07"/>
    </feComponentTransfer>
  </filter>
  <linearGradient id="blueVein" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#31a4ff" stop-opacity="0.0"/>
    <stop offset="0.45" stop-color="#31a4ff" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#0c58b1" stop-opacity="0.0"/>
  </linearGradient>
  <linearGradient id="whiteVein" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#fff8ef" stop-opacity="0.32"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="1200" height="2400" fill="url(#base)"/>
<rect width="1200" height="2400" filter="url(#noise)" opacity="0.7"/>
<g opacity="0.7">
  <path d="M-150 250 C 220 100, 500 420, 1290 180" stroke="url(#whiteVein)" stroke-width="86" fill="none"/>
  <path d="M-100 420 C 350 260, 760 640, 1300 440" stroke="url(#blueVein)" stroke-width="54" fill="none"/>
  <path d="M-120 900 C 300 760, 720 1030, 1290 820" stroke="url(#whiteVein)" stroke-width="94" fill="none"/>
  <path d="M-180 1180 C 180 1030, 680 1370, 1310 1130" stroke="url(#blueVein)" stroke-width="46" fill="none"/>
  <path d="M-80 1500 C 420 1320, 760 1710, 1290 1500" stroke="url(#whiteVein)" stroke-width="88" fill="none"/>
  <path d="M-100 1840 C 280 1680, 780 2010, 1310 1800" stroke="url(#blueVein)" stroke-width="50" fill="none"/>
</g>
<g opacity="0.18">
  <circle cx="1040" cy="260" r="150" fill="#45b0ff"/>
  <circle cx="160" cy="640" r="120" fill="#fff8ed"/>
  <circle cx="990" cy="1500" r="130" fill="#2c92f5"/>
  <circle cx="220" cy="1980" r="150" fill="#fff5dc"/>
</g>
</svg>
