<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c2441">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pétanque Score">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>Pétanque Score</title>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="header-shine"></div>
      <div class="header-left">
        <div class="logo-shell"><img src="icons/icon.svg" alt="Logo Pétanque Score"></div>
        <div class="title-stack">
          <h1>Pétanque Score</h1>
          <p>Compteur Points</p>
        </div>
      </div>
      <div class="header-orb" aria-hidden="true"></div>
    </header>

    <section id="setup" class="panel setup">
      <div id="resumeCard" class="resume-card hidden">
        <div>
          <strong>Partie en cours</strong>
          <span id="resumeInfo">0 - 0</span>
        </div>
        <button id="resumeBtn" class="resume-btn">▶ Reprendre</button>
      </div>

      <div class="setup-head">
        <h2>Nouvelle partie</h2>
        <p>Choisis le format puis saisis les prénoms.</p>
      </div>

      <div class="modes">
        <button class="mode active" data-mode="Tête-à-tête">Tête-à-tête<br><small>1 joueur</small></button>
        <button class="mode" data-mode="Doublette">Doublette<br><small>2 joueurs</small></button>
        <button class="mode" data-mode="Triplette">Triplette<br><small>3 joueurs</small></button>
      </div>

      <div class="fields">
        <label class="field field-a">
          <span class="field-label">Équipe gauche</span>
          <input id="nameA" placeholder="Ex. Noah">
        </label>
        <label class="field field-b">
          <span class="field-label">Équipe droite</span>
          <input id="nameB" placeholder="Ex. Théo">
        </label>
      </div>

      <button id="startBtn" class="primary">＋ Nouvelle partie</button>
    </section>

    <section id="game" class="panel game hidden">
      <div class="meta-row top-stats">
        <div class="pill" id="modeText">Tête-à-tête</div>
        <div class="pill">⏱ <strong id="timer">00:00:00</strong></div>
        <div class="pill" id="endCount">0 mène</div>
      </div>

      <div class="arena">
        <div class="team-side">
          <div class="score-card a" id="cardA">
            <div class="team-name" id="liveNameA">Joueur 1</div>
            <div class="score" id="scoreA">0</div>
          </div>
          <div class="points" id="padA"></div>
        </div>

        <div class="team-side">
          <div class="score-card b" id="cardB">
            <div class="team-name" id="liveNameB">Joueur 2</div>
            <div class="score" id="scoreB">0</div>
          </div>
          <div class="points" id="padB"></div>
        </div>
      </div>

      <div class="action-grid top-actions">
        <button class="action null" id="nullBtn">⊖ Mène nulle</button>
        <button class="action" id="undoBtn">↶ Annuler</button>
      </div>

      <div class="history">
        <div class="history-head">
          <span>2 dernières mènes</span>
          <span>↶ dernière annulable</span>
        </div>
        <div class="ends" id="history"></div>
      </div>

      <div class="action-grid bottom-actions">
        <button class="action quit" id="quitBtn">✕ Quitter la partie</button>
        <button class="action reset" id="resetBtn">⟳ Reset</button>
      </div>
    </section>

    <section id="victory" class="panel victory hidden">
      <div class="cup">🏆</div>
      <div class="victory-sub">Partie terminée</div>
      <h2 id="winnerText">Victoire</h2>
      <div class="final">
        <div class="final-card"><div class="final-name" id="finalNameA"></div><div class="final-score" id="finalScoreA"></div></div>
        <div class="final-card"><div class="final-name" id="finalNameB"></div><div class="final-score" id="finalScoreB"></div></div>
      </div>
      <div class="meta-row victory-meta"><div class="pill" id="finalTime"></div><div class="pill" id="finalEnds"></div></div>
      <button id="rematchBtn" class="primary">↻ Revanche</button>
      <button id="newBtn" class="action full">Nouvelle partie</button>
    </section>
  </div>

<script>
const KEY='petanqueScore.v050';
const DEFAULT_STATE={mode:'Tête-à-tête',nameA:'',nameB:'',scoreA:0,scoreB:0,history:[],totalEnds:0,startedAt:null,running:false};
let state={...DEFAULT_STATE};
const $=id=>document.getElementById(id);

function saveLocal(){localStorage.setItem(KEY,JSON.stringify(state));updateResumeCard();}
function loadLocal(){try{const raw=localStorage.getItem(KEY);if(raw)state={...state,...JSON.parse(raw)};}catch(e){}}
function hasSavedGame(){return !!(state.startedAt&&(state.running||state.scoreA||state.scoreB||state.totalEnds));}
function expectedLines(mode){if(mode==='Doublette')return 2;if(mode==='Triplette')return 3;return 1;}
function parseNames(value,mode){return String(value||'').split(/\r?\n|\s*[\/,;|+]\s*/g).map(s=>s.trim()).filter(Boolean).slice(0,expectedLines(mode));}
function formatDisplayName(value,fallback,mode){const parts=parseNames(value,mode);if(!parts.length)parts.push(fallback);while(parts.length<expectedLines(mode))parts.push('');return parts.join('\n');}
function firstDisplayName(value,fallback,mode){return parseNames(value,mode)[0]||fallback;}
function refreshPlaceholders(){const mode=document.querySelector('.mode.active')?.dataset.mode||state.mode;if(mode==='Doublette'){$('nameA').placeholder='Noah / Théo';$('nameB').placeholder='Marc / Luc';}else if(mode==='Triplette'){$('nameA').placeholder='Noah / Théo / Éric';$('nameB').placeholder='Marc / Luc / Paul';}else{$('nameA').placeholder='Ex. Noah';$('nameB').placeholder='Ex. Théo';}}
function syncSetupFields(){$('nameA').value='';$('nameB').value='';document.querySelectorAll('.mode').forEach(btn=>btn.classList.toggle('active',btn.dataset.mode==='Tête-à-tête'));refreshPlaceholders();}
function updateResumeCard(){const card=$('resumeCard');if(!card)return;if(hasSavedGame()){card.classList.remove('hidden');const a=firstDisplayName(state.nameA,'J1',state.mode),b=firstDisplayName(state.nameB,'J2',state.mode);$('resumeInfo').textContent=`${a} ${state.scoreA} - ${state.scoreB} ${b} • ${state.totalEnds} mène${state.totalEnds>1?'s':''}`;}else card.classList.add('hidden');}
function pulse(el,cls,ms=520){if(!el)return;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),ms);}
function buildPads(){for(const side of ['A','B']){const box=$('pad'+side);box.innerHTML='';for(let i=1;i<=6;i++){const btn=document.createElement('button');btn.className='pt '+(side==='A'?'pt-a':'pt-b');btn.textContent='+'+i;btn.addEventListener('click',()=>recordScore(side,i,btn));box.appendChild(btn);}}}
function pushHistory(entry){state.history.push(entry);if(state.history.length>2)state.history=state.history.slice(-2);}
function recordScore(side,pts,btn){const beforeA=state.scoreA,beforeB=state.scoreB;if(side==='A')state.scoreA=Math.min(13,state.scoreA+pts);else state.scoreB=Math.min(13,state.scoreB+pts);state.totalEnds+=1;pushHistory({type:'score',side,pts,beforeA,beforeB,a:state.scoreA,b:state.scoreB,endNo:state.totalEnds});pulse(btn,side==='A'?'flashA':'flashB');pulse($(side==='A'?'cardA':'cardB'),'changed');render();saveLocal();checkVictory();}
function nullEnd(){state.totalEnds+=1;pushHistory({type:'null',beforeA:state.scoreA,beforeB:state.scoreB,a:state.scoreA,b:state.scoreB,endNo:state.totalEnds});pulse($('nullBtn'),'flashDark');render();saveLocal();}
function undo(){if(!state.history.length)return;const last=state.history.pop();state.scoreA=last.beforeA;state.scoreB=last.beforeB;state.totalEnds=Math.max(0,state.totalEnds-1);pulse($('undoBtn'),'flashDark');render();saveLocal();}
function quitGame(){if(!confirm('Quitter cette partie ? La sauvegarde en cours sera supprimée.'))return;localStorage.removeItem(KEY);state={...DEFAULT_STATE};syncSetupFields();updateResumeCard();show('setup');}
function resetGame(){if(!confirm('Remettre les scores à zéro ?'))return;state.scoreA=0;state.scoreB=0;state.history=[];state.totalEnds=0;state.startedAt=Date.now();state.running=true;render();saveLocal();}
function startGame(){if(hasSavedGame()&&!confirm('Une partie est déjà en cours. Démarrer une nouvelle partie et remplacer la sauvegarde ?'))return;state.mode=document.querySelector('.mode.active').dataset.mode;state.nameA=$('nameA').value.trim()||'Joueur 1';state.nameB=$('nameB').value.trim()||'Joueur 2';state.scoreA=0;state.scoreB=0;state.history=[];state.totalEnds=0;state.startedAt=Date.now();state.running=true;saveLocal();show('game');render();}
function resumeGame(){if(!hasSavedGame())return;show('game');render();}
function checkVictory(){if(state.scoreA>=13||state.scoreB>=13){state.running=false;const winner=state.scoreA>=13?state.nameA:state.nameB;$('winnerText').textContent='Victoire '+firstDisplayName(winner,'Gagnant',state.mode);$('finalNameA').textContent=formatDisplayName(state.nameA,'Joueur 1',state.mode);$('finalNameB').textContent=formatDisplayName(state.nameB,'Joueur 2',state.mode);$('finalScoreA').textContent=state.scoreA;$('finalScoreB').textContent=state.scoreB;$('finalTime').textContent=$('timer').textContent;$('finalEnds').textContent=state.totalEnds+(state.totalEnds>1?' mènes':' mène');show('victory');saveLocal();}}
function show(id){['setup','game','victory'].forEach(section=>$(section).classList.toggle('hidden',section!==id));}
function render(){$('liveNameA').textContent=formatDisplayName(state.nameA,'Joueur 1',state.mode);$('liveNameB').textContent=formatDisplayName(state.nameB,'Joueur 2',state.mode);$('scoreA').textContent=state.scoreA;$('scoreB').textContent=state.scoreB;$('modeText').textContent=state.mode;$('endCount').textContent=state.totalEnds+(state.totalEnds>1?' mènes':' mène');const history=$('history');history.innerHTML='';if(!state.history.length){const item=document.createElement('div');item.className='end empty-end';item.textContent='Aucune mène';history.appendChild(item);}else{state.history.forEach(h=>{const item=document.createElement('div');if(h.type==='null'){item.className='end null';item.textContent='M'+h.endNo+' • nulle • '+h.a+'-'+h.b;}else{item.className='end '+(h.side==='A'?'a':'b');const n=h.side==='A'?firstDisplayName(state.nameA,'J1',state.mode):firstDisplayName(state.nameB,'J2',state.mode);item.textContent='M'+h.endNo+' • '+n+' +'+h.pts+' • '+h.a+'-'+h.b;}history.appendChild(item);});}}
function formatTime(ms){const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return[h,m,sec].map(v=>String(v).padStart(2,'0')).join(':');}
setInterval(()=>{if(state.startedAt)$('timer').textContent=formatTime(Date.now()-state.startedAt);},1000);
document.querySelectorAll('.mode').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));btn.classList.add('active');refreshPlaceholders();}));
$('startBtn').addEventListener('click',startGame);$('resumeBtn').addEventListener('click',resumeGame);$('nullBtn').addEventListener('click',nullEnd);$('undoBtn').addEventListener('click',undo);$('quitBtn').addEventListener('click',quitGame);$('resetBtn').addEventListener('click',resetGame);$('rematchBtn').addEventListener('click',()=>{state.scoreA=0;state.scoreB=0;state.history=[];state.totalEnds=0;state.startedAt=Date.now();state.running=true;saveLocal();show('game');render();});$('newBtn').addEventListener('click',()=>{localStorage.removeItem(KEY);state={...DEFAULT_STATE};syncSetupFields();updateResumeCard();show('setup');});
buildPads();loadLocal();syncSetupFields();updateResumeCard();show('setup');
if('serviceWorker'in navigator){navigator.serviceWorker.register('./service-worker.js').catch(()=>{});}
</script>
</body>
</html>
