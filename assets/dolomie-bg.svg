<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600">
  <defs>
    <linearGradient id="sand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4e6a5"/>
      <stop offset="0.45" stop-color="#e8cf78"/>
      <stop offset="1" stop-color="#d9b95e"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="20%" r="75%">
      <stop offset="0" stop-color="#fff8d7" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#b98e35" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.42" numOctaves="3" seed="27" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="grainAlpha">
        <feFuncA type="table" tableValues="0 0.14"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="grainAlpha" mode="multiply"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect width="900" height="1600" fill="url(#sand)"/>
  <rect width="900" height="1600" fill="url(#light)"/>
  <g opacity="0.28" filter="url(#grain)"><rect x="0" y="0" width="900" height="1600" fill="#d8bd67"/></g>
  <g fill="#fff5c7" opacity="0.35">
    <ellipse cx="105" cy="175" rx="18" ry="9" transform="rotate(-18 105 175)"/>
    <ellipse cx="285" cy="360" rx="12" ry="7" transform="rotate(24 285 360)"/>
    <ellipse cx="690" cy="230" rx="17" ry="8" transform="rotate(12 690 230)"/>
    <ellipse cx="790" cy="530" rx="10" ry="6" transform="rotate(-28 790 530)"/>
    <ellipse cx="160" cy="730" rx="15" ry="7" transform="rotate(31 160 730)"/>
    <ellipse cx="540" cy="890" rx="19" ry="8" transform="rotate(-14 540 890)"/>
    <ellipse cx="320" cy="1160" rx="14" ry="7" transform="rotate(22 320 1160)"/>
    <ellipse cx="735" cy="1360" rx="16" ry="8" transform="rotate(-24 735 1360)"/>
  </g>
  <g fill="#9a762b" opacity="0.18">
    <circle cx="200" cy="250" r="3"/><circle cx="460" cy="170" r="2.5"/><circle cx="820" cy="320" r="3"/>
    <circle cx="620" cy="650" r="2.5"/><circle cx="360" cy="770" r="3"/><circle cx="110" cy="980" r="2.5"/>
    <circle cx="690" cy="1110" r="3"/><circle cx="420" cy="1430" r="2.5"/>
  </g>
  <path d="M0 1320 C220 1260 440 1380 900 1290 L900 1600 L0 1600Z" fill="#cba84f" opacity="0.12" filter="url(#soft)"/>
